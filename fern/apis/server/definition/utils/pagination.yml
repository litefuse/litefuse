types:
  # to be used as copy/paste template for query strings
  # PaginationRequest:
  #   properties:
  #     page:
  #       type: optional<integer>
  #       docs: page number, starts at 1
  #     limit:
  #       type: optional<integer>
  #       docs: limit of items per page
  MetaResponse:
    properties:
      page:
        type: integer
        docs: current page number
      limit:
        type: integer
        docs: number of items per page
      totalItems:
        type: integer
        docs: number of total items given the current filters/selection (if any)
      totalPages:
        type: integer
        docs: number of total pages given the current limit
  # LITEFUSE ADDITION: copied from upstream 4.56.0 so the cursor-paginated
  # stable endpoints (`/api/public/v2/evaluators`, `/api/public/v2/evaluation-rules`)
  # can be described in `evaluators.yml` / `evaluation-rules.yml`.
  CursorMetaResponse:
    docs: Metadata for cursor-based pagination.
    properties:
      cursor:
        type: optional<string>
        docs: Opaque cursor for the next page. Omitted when there is no next page.
