# 从仓库根目录执行（复用 docker-compose.yml 和 doris-config/）
# cp .env.nginx.example .env.nginx，填写后执行
# docker compose --env-file .env.nginx -f docker-compose.nginx.yml up -d
name: litefuse-nginx

x-app-env: &app-env
  NEXTAUTH_URL: &public-url ${NEXTAUTH_URL:-http://litefuse.localhost}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
  SALT: ${SALT:?set SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a 64-character hex key}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set a hex PostgreSQL password}@postgres:5432/postgres
  REDIS_AUTH: ${REDIS_AUTH:?set the Redis password}
  DORIS_URL: http://doris_fe:8030
  LITEFUSE_S3_EVENT_UPLOAD_BUCKET: litefuse
  LITEFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LITEFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: &minio-user ${MINIO_ROOT_USER:-minio}
  LITEFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: &minio-password ${MINIO_ROOT_PASSWORD:?set the MinIO password}
  LITEFUSE_S3_MEDIA_UPLOAD_BUCKET: litefuse
  LITEFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LITEFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: *minio-user
  LITEFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: *minio-password
  LITEFUSE_S3_MEDIA_UPLOAD_ENDPOINT: *public-url
  LITEFUSE_S3_BATCH_EXPORT_BUCKET: litefuse
  LITEFUSE_S3_BATCH_EXPORT_REGION: us-east-1
  LITEFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: *minio-user
  LITEFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: *minio-password
  LITEFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: *public-url

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - litefuse-web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/litefuse.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - litefuse.localhost

  litefuse-web:
    extends: {file: docker-compose.yml, service: litefuse-web}
    image: litefuse/litefuse-web:${LITEFUSE_VERSION:-26.3.0}
    ports: !reset []
    environment: *app-env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m

  litefuse-worker:
    extends: {file: docker-compose.yml, service: litefuse-worker}
    image: litefuse/litefuse-worker:${LITEFUSE_VERSION:-26.3.0}
    ports: !reset []
    depends_on:
      litefuse-web:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "3030"

  postgres:
    extends: {file: docker-compose.yml, service: postgres}
    ports: !reset []
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    extends: {file: docker-compose.yml, service: redis}
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_AUTH}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]

  minio:
    extends: {file: docker-compose.yml, service: minio}
    ports: !reset []
    environment:
      MINIO_ROOT_USER: *minio-user
      MINIO_ROOT_PASSWORD: *minio-password

  doris_fe:
    extends: {file: docker-compose.yml, service: doris_fe}
    container_name: !reset null
    ports: !reset []

  doris_be:
    extends: {file: docker-compose.yml, service: doris_be}
    container_name: !reset null
    ports: !reset []

volumes:
  litefuse_postgres_data:
  litefuse_redis_data:
  litefuse_minio_data:
  doris_fe_meta:
  doris_be_storage:

networks:
  doris_internal:
    ipam:
      config:
        - subnet: 172.29.0.0/24
